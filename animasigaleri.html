<script>
    function toggleBackground() {
        // Mengambil elemen <body>
        const elemenBody = document.body;

        // Menambah atau menghapus kelas 'bg-aktif' secara bergantian (on/off)
        elemenBody.classList.toggle('bgAnimation-active');

        // Mengubah teks pada tombol sesuai kondisi aktif/tidak
        const tombol = document.querySelector('button');
        if (elemenBody.classList.contains('bgAnimation-active')) {
            tombol.textContent = 'Turn off';
        } else {
            tombol.textContent = 'Turn on';
        }
    }
</script>
